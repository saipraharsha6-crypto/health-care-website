<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#1a4d6c" />
    </linearGradient>
    <!-- Accent Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Soft Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Decorative Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Glowing Abstract Waves -->
  <path d="M-100,320 Q150,220 400,350 T900,280 L900,480 L-100,480 Z" fill="url(#tealGrad)" fill-opacity="0.15" filter="url(#glow)" />
  <path d="M-100,360 Q200,300 450,400 T900,320 L900,480 L-100,480 Z" fill="url(#tealGrad)" fill-opacity="0.2" />

  <!-- Heartbeat ECG Waveform (Right Side) -->
  <path d="M 380 250 L 450 250 L 460 220 L 470 290 L 485 160 L 500 320 L 512 230 L 520 265 L 530 250 L 620 250" 
        fill="none" stroke="url(#tealGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Main Illustration: The Clinic Shield & Cross (Left-Center) -->
  <g transform="translate(180, 200)" filter="url(#shadow)">
    <!-- Base Shield -->
    <path d="M -60 -80 C -60 -80 0 -100 60 -80 C 60 10 50 60 0 100 C -50 60 -60 10 -60 -80 Z" 
          fill="#111c2e" stroke="#10b981" stroke-width="3" />
    
    <!-- Medical Cross -->
    <path d="M -15 -45 L 15 -45 L 15 -15 L 45 -15 L 45 15 L 15 15 L 15 45 L -15 45 L -15 15 L -45 15 L -45 -15 L -15 -15 Z" 
          fill="url(#tealGrad)" />

    <!-- Ring Accent -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="8,6" />
  </g>

  <!-- Modern Floating Elements representing Health Areas -->
  <!-- Stethoscope Node -->
  <g transform="translate(560, 140)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="30" fill="#132742" stroke="#10b981" stroke-width="2" />
    <path d="M-10,-10 C-10,-10 -15,0 -5,10 C0,15 10,10 10,0 C10,-10 0,-15 -10,-10 Z" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M-5,10 C-5,10 -2,15 5,12" fill="none" stroke="#10b981" stroke-width="2" />
  </g>

  <!-- Medicine Capsule Node -->
  <g transform="translate(320, 110)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="24" fill="#132742" stroke="#10b981" stroke-width="2" />
    <rect x="-6" y="-12" width="12" height="24" rx="6" fill="none" stroke="#fff" stroke-width="2" transform="rotate(45)" />
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#10b981" stroke-width="2" />
  </g>

  <!-- Pulse Heart Node -->
  <g transform="translate(680, 280)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="28" fill="#132742" stroke="#10b981" stroke-width="2" />
    <path d="M0,10 C-10,0 -15,-8 -15,-13 C-15,-18 -10,-22 -5,-22 C-1,-22 0,-16 0,-16 C0,-16 1,-22 5,-22 C10,-22 15,-18 15,-13 C15,-8 10,0 0,10 Z" 
          fill="#10b981" transform="scale(0.8) translate(-1, -2)"/>
  </g>
</svg>
