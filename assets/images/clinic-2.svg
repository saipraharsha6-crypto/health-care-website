<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="labBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background Room Wall -->
  <rect width="400" height="300" fill="url(#labBg)" />
  
  <!-- Floor -->
  <rect y="230" width="400" height="70" fill="#1e293b" />
  <line x1="0" y1="230" x2="400" y2="230" stroke="#3b82f6" stroke-width="2" />

  <!-- Grid Pattern on wall for high-tech feeling -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="230" />
    <line x1="100" y1="0" x2="100" y2="230" />
    <line x1="150" y1="0" x2="150" y2="230" />
    <line x1="200" y1="0" x2="200" y2="230" />
    <line x1="250" y1="0" x2="250" y2="230" />
    <line x1="300" y1="0" x2="300" y2="230" />
    <line x1="350" y1="0" x2="350" y2="230" />
  </g>

  <!-- Scientific DNA Strand Screen Panel -->
  <rect x="40" y="40" width="120" height="90" rx="6" fill="#020617" stroke="#3b82f6" stroke-width="2" />
  <path d="M 50 85 Q 70 65 90 85 T 130 85" fill="none" stroke="#3b82f6" stroke-width="2" />
  <path d="M 50 85 Q 70 105 90 85 T 130 85" fill="none" stroke="#10b981" stroke-width="2" />
  <line x1="70" y1="75" x2="70" y2="95" stroke="#94a3b8" stroke-width="1" />
  <line x1="90" y1="85" x2="90" y2="85" stroke="#94a3b8" stroke-width="1" />
  <line x1="110" y1="75" x2="110" y2="95" stroke="#94a3b8" stroke-width="1" />
  
  <!-- Microscope on Lab Desk -->
  <g transform="translate(260, 110)">
    <!-- Base Desk -->
    <rect x="-60" y="80" width="160" height="10" rx="2" fill="#cbd5e1" />
    <rect x="-40" y="90" width="20" height="30" fill="#475569" />
    <rect x="60" y="90" width="20" height="30" fill="#475569" />

    <!-- Microscope Body -->
    <path d="M 30 80 L 30 75 H -10 L -10 80 Z" fill="#334155" /> <!-- Stage -->
    <rect x="0" y="80" width="20" height="6" fill="#10b981" /> <!-- Specimen slide -->
    
    <path d="M 40 80 C 40 40 10 30 10 30 L 0 45 L 10 55" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
    <rect x="-5" y="30" width="12" height="24" rx="2" fill="#334155" transform="rotate(-25)" /> <!-- Eyepiece -->
    <rect x="5" y="55" width="10" height="15" fill="#1e293b" /> <!-- Objective lenses -->
    <circle cx="35" cy="55" r="5" fill="#f59e0b" /> <!-- Focus knob -->
  </g>

  <!-- ECG Heart Rate Monitor Panel -->
  <rect x="180" y="40" width="180" height="90" rx="6" fill="#020617" stroke="#10b981" stroke-width="2" />
  <path d="M 190 85 L 220 85 L 225 70 L 230 100 L 238 50 L 245 110 L 250 80 L 255 90 L 260 85 L 350 85" 
        fill="none" stroke="url(#pulseGrad)" stroke-width="2" />
  <text x="190" y="58" fill="#10b981" font-family="monospace" font-size="10">ECG MONITOR: ACTIVE</text>
  <text x="310" y="58" fill="#ef4444" font-family="monospace" font-size="10" font-weight="bold">72 BPM</text>

  <!-- Beakers and Test Tubes -->
  <g transform="translate(140, 160)">
    <!-- Stand -->
    <rect x="-10" y="30" width="60" height="4" fill="#64748b" />
    <!-- Tubes -->
    <rect x="0" y="0" width="8" height="30" rx="2" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="12" width="8" height="18" rx="2" fill="#ef4444" opacity="0.8" />
    
    <rect x="15" y="0" width="8" height="30" rx="2" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="15" y="6" width="8" height="24" rx="2" fill="#3b82f6" opacity="0.8" />

    <rect x="30" y="0" width="8" height="30" rx="2" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="30" y="18" width="8" height="12" rx="2" fill="#10b981" opacity="0.8" />
  </g>
</svg>
