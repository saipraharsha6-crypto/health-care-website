<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="95" />
    </clipPath>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="scrubs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="#10b981" stroke-width="3" />

  <!-- Avatar Group -->
  <g clip-path="url(#circleClip)">
    <!-- Background -->
    <rect width="200" height="200" fill="url(#avatarBg)" />

    <!-- Shoulders / Clothes -->
    <path d="M 30 200 C 30 150 70 135 100 135 C 130 135 170 150 170 200 Z" fill="#ffffff" />
    <!-- V-Neck Scrubs -->
    <path d="M 80 135 L 120 135 L 115 155 L 100 175 L 85 155 Z" fill="url(#scrubs)" />
    <!-- Coat Collar Details -->
    <path d="M 60 135 L 85 135 L 90 170 L 75 190 Z" fill="#e2e8f0" />
    <path d="M 140 135 L 115 135 L 110 170 L 125 190 Z" fill="#e2e8f0" />

    <!-- Stethoscope -->
    <path d="M 75 135 C 75 160 125 160 125 135" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <path d="M 90 152 C 90 175 110 175 110 152" fill="none" stroke="#475569" stroke-width="2" />
    <circle cx="100" cy="175" r="7" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />

    <!-- Neck -->
    <rect x="88" y="90" width="24" height="50" rx="6" fill="#fbcfe8" /> <!-- Light Skin tone base -->
    <path d="M 88 120 C 88 135 112 135 112 120 Z" fill="#f472b6" opacity="0.3" />

    <!-- Head -->
    <circle cx="100" cy="85" r="32" fill="#fbcfe8" />

    <!-- Hair (Male Short Crop) -->
    <path d="M 68 85 C 68 55 132 55 132 85 C 132 75 125 65 100 65 C 75 65 68 75 68 85 Z" fill="#1e293b" />
    <path d="M 68 80 L 72 90 L 76 80 Z" fill="#1e293b" />

    <!-- Ears -->
    <circle cx="67" cy="88" r="7" fill="#fbcfe8" />
    <circle cx="133" cy="88" r="7" fill="#fbcfe8" />

    <!-- Face Details -->
    <!-- Eyes -->
    <circle cx="88" cy="85" r="3" fill="#1e293b" />
    <circle cx="112" cy="85" r="3" fill="#1e293b" />
    <!-- Eyebrows -->
    <path d="M 82 79 Q 88 77 94 80" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <path d="M 106 79 Q 112 77 118 80" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <!-- Glasses -->
    <circle cx="88" cy="85" r="9" fill="none" stroke="#f59e0b" stroke-width="2" />
    <circle cx="112" cy="85" r="9" fill="none" stroke="#f59e0b" stroke-width="2" />
    <line x1="97" y1="85" x2="103" y2="85" stroke="#f59e0b" stroke-width="2" />
    <line x1="79" y1="83" x2="68" y2="85" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="121" y1="83" x2="132" y2="85" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Nose -->
    <path d="M 100 85 Q 102 93 98 94" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round" />
    <!-- Smile -->
    <path d="M 90 102 Q 100 110 110 102" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
