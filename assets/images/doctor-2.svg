<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <clipPath id="circleClip2">
      <circle cx="100" cy="100" r="95" />
    </clipPath>
    <linearGradient id="avatarBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="scrubs2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="#10b981" stroke-width="3" />

  <!-- Avatar Group -->
  <g clip-path="url(#circleClip2)">
    <!-- Background -->
    <rect width="200" height="200" fill="url(#avatarBg2)" />

    <!-- Shoulders / Clothes -->
    <path d="M 30 200 C 30 152 70 138 100 138 C 130 138 170 152 170 200 Z" fill="#ffffff" />
    <!-- V-Neck Scrubs -->
    <path d="M 82 138 L 118 138 L 112 155 L 100 173 L 88 155 Z" fill="url(#scrubs2)" />
    <!-- Coat Collar Details -->
    <path d="M 62 138 L 86 138 L 91 168 L 77 190 Z" fill="#e2e8f0" />
    <path d="M 138 138 L 114 138 L 109 168 L 123 190 Z" fill="#e2e8f0" />

    <!-- Stethoscope -->
    <path d="M 78 138 C 78 162 122 162 122 138" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <path d="M 92 152 C 92 173 108 173 108 152" fill="none" stroke="#475569" stroke-width="2" />
    <circle cx="100" cy="173" r="6.5" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />

    <!-- Neck -->
    <rect x="89" y="92" width="22" height="48" rx="6" fill="#fed7aa" /> <!-- Medium skin tone -->
    <path d="M 89 122 C 89 135 111 135 111 122 Z" fill="#f97316" opacity="0.25" />

    <!-- Head -->
    <circle cx="100" cy="86" r="30" fill="#fed7aa" />

    <!-- Hair (Long dark hair tied back) -->
    <path d="M 68 95 C 68 85 70 60 100 60 C 130 60 132 85 132 95 Z" fill="#27272a" />
    <circle cx="100" cy="54" r="14" fill="#27272a" /> <!-- Hair bun -->

    <!-- Ears -->
    <circle cx="68" cy="89" r="6" fill="#fed7aa" />
    <circle cx="132" cy="89" r="6" fill="#fed7aa" />

    <!-- Face Details -->
    <!-- Eyes -->
    <ellipse cx="89" cy="85" rx="2.5" ry="3.5" fill="#18181b" />
    <ellipse cx="111" cy="85" rx="2.5" ry="3.5" fill="#18181b" />
    <!-- Eyelashes/details -->
    <path d="M 84 81 Q 89 79 93 83" fill="none" stroke="#18181b" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 116 81 Q 111 79 107 83" fill="none" stroke="#18181b" stroke-width="1.5" stroke-linecap="round" />
    <!-- Eyebrows -->
    <path d="M 83 78 Q 89 75 94 78" fill="none" stroke="#27272a" stroke-width="2" stroke-linecap="round" />
    <path d="M 117 78 Q 111 75 106 78" fill="none" stroke="#27272a" stroke-width="2" stroke-linecap="round" />
    <!-- Nose -->
    <path d="M 100 85 Q 101 92 99 93" fill="none" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" />
    <!-- Smile -->
    <path d="M 92 101 Q 100 109 108 101" fill="none" stroke="#be123c" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
